name: CI Smoke (make smoke)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci-smoke:
    name: CI Smoke (make smoke)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Python Version
        id: pyver
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .python-version ]; then
            ver="$(head -n 1 .python-version | tr -d '[:space:]')"
          elif [ -f runtime.txt ]; then
            line="$(head -n 1 runtime.txt | tr -d '[:space:]')"
            ver="${line#python-}"
          else
            ver="3.11"
          fi
          if [ -z "$ver" ]; then
            ver="3.11"
          fi
          echo "python_version=$ver" >> "$GITHUB_OUTPUT"
          echo "Using Python $ver"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.python_version }}

      - name: Install Dependencies (Repo Convention)
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^deps:' Makefile; then
            make deps
          elif grep -Eq '^venv:' Makefile; then
            make venv
          elif [ -f requirements-dev.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          else
            echo "No dependency install step required."
          fi

      - name: Run Smoke Gate
        shell: bash
        run: |
          set -euo pipefail
          make smoke
