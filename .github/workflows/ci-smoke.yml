name: CI Smoke (make smoke)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci-smoke:
    name: CI Smoke (make smoke)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Python Version
        id: pyver
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .python-version ]; then
            ver="$(head -n 1 .python-version | tr -d '[:space:]')"
          elif [ -f runtime.txt ]; then
            line="$(head -n 1 runtime.txt | tr -d '[:space:]')"
            ver="${line#python-}"
          else
            ver="3.11"
          fi
          if [ -z "$ver" ]; then
            ver="3.11"
          fi
          echo "python_version=$ver" >> "$GITHUB_OUTPUT"
          echo "Using Python $ver"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.python_version }}

      - name: Cache Virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.pyver.outputs.python_version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ steps.pyver.outputs.python_version }}-

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          make deps

      - name: Run Smoke Gate
        shell: bash
        run: |
          set -euo pipefail
          make smoke
