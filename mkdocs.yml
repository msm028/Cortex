site_name: Cortex Docs

nav:
  - Home: index.md
  - Architecture:
      - Architecture Overview: ARCHITECTURE.md
      - Architecture Diagrams: architecture-diagrams.md
  - Inventory: inventory.md
  - Changelog: CHANGELOG.md
  - Governance:
      - Governance Index: governance/GOVERNANCE.md
      - CI Governance: governance/ci.md
  - Decisions:
      - Decisions Index: decisions/README.md
      - ADR-0003 Environment Split: decisions/ADR-0003-environment-split.md
      - 0003 Pin Core Container Images: decisions/0003-pin-core-container-images.md
  - Runbooks:
      - Runbooks Index: runbooks/README.md
      - Backups And Restore Test: runbooks/backups.md
      - Bootstrap Core: runbooks/bootstrap-core.md
      - Bitwarden CLI: runbooks/bw-cli.md
      - Changelog And Release Notes: runbooks/changelog.md
      - Deploy Wiki: runbooks/deploy-wiki.md
      - Development Setup: runbooks/dev-setup.md
      - Doctor Diagnostics: runbooks/doctor.md
      - Edge Access: runbooks/edge-access.md
      - Environment Variables: runbooks/env-vars.md
      - Golden Path: runbooks/golden-path.md
      - Ops Commands: runbooks/ops-commands.md
      - Plan Validate Execute: runbooks/plans.md
      - Ports and Service Map: runbooks/ports-and-service-map.md
      - IaC Provisioning Index: runbooks/provisioning-iac.md
      - Provision Cortex-Control: runbooks/provision-cortex-control.md
      - Provision Cortex-Data: runbooks/provision-cortex-data.md
      - Publish Wiki With Cloudflare Access: runbooks/publish-wiki-cloudflare-access.md
      - Smoke Preflight: runbooks/smoke.md
      - Stack Status: runbooks/status.md
      - Testing: runbooks/testing.md
      - Repository Validator: runbooks/validator.md
      - Vaultwarden Env: runbooks/vaultwarden-env.md
      - Vaultwarden Recovery: runbooks/vaultwarden.md
  - Skills:
      - Skills Index: skills/README.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
