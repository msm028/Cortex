services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cortex_net

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cortex_net

  vaultwarden:
    image: vaultwarden/server:1.35.3
    restart: unless-stopped
    environment:
      DATABASE_URL: ${VAULTWARDEN_DATABASE_URL}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      DOMAIN: ${VAULTWARDEN_DOMAIN:-https://vault.${PUBLIC_DOMAIN}}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
    volumes:
      - vaultwarden_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/alive >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cortex_net

volumes:
  postgres_data:
  minio_data:
  vaultwarden_data:

networks:
  cortex_net:
    external: true
